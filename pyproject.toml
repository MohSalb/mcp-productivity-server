[project]
name = "mcp-productivity-server"
version = "0.1.0"
description = "A Personal Productivity MCP server (task tracking + email drafting) built on the MCP Python SDK, for ENMGT/DevOps MCP assignment."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
productivity-mcp = "productivity_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/productivity_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
